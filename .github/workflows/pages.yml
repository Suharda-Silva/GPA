name: Build and deploy Flet web to GitHub Pages

on:
  push:
    branches:
      - feat/flet-gui-wrapper
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory '*'

      - name: Compute Pages base path
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          # For project pages the base href should be "/<repo>/".
          echo "BASE_PATH=/$REPO_NAME/" >> $GITHUB_ENV
          echo "PAGES_URL=https://${GITHUB_ACTOR}.github.io/$REPO_NAME" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          uv sync

      - name: Build Flet web (uv runner)
        run: |
          # Build to docs so the artifact is ready for GitHub Pages.
          uv run flet build web --output docs

      - name: Verify build output exists
        run: |
          set -eux
          test -f docs/index.html
          ls -la docs

      - name: Ensure base href in built index.html
        if: always()
        run: |
          set -eux
          if [ -f docs/index.html ]; then
            if grep -q '<base ' docs/index.html; then
              sed -i 's|<base href="[^"]*"|<base href="'"${BASE_PATH}"'"|g' docs/index.html || true
            else
              sed -i 's|<head>|<head><base href="'"${BASE_PATH}"'">|' docs/index.html || true
            fi
          else
            echo "docs/index.html not found — build may have failed" >&2
            ls -la docs || true
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
